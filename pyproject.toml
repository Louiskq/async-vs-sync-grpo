[project]
name = "async-grpo-hpcontrol"
version = "0.1.0"
description = "Async vs sync GRPO on GSM8K, and within-run control of max_staleness"
requires-python = ">=3.11"
# Cluster environment is pinned in requirements.lock (generated by slurm/setup_env.sh).
# Local tests only need these (no GPU, no vLLM):
dependencies = ["trl==1.18.2", "torch", "transformers", "datasets", "pyyaml", "numpy", "matplotlib", "nvidia-ml-py"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() strictness: lengths are equal by construction where it matters
